[tools]
node = "24"
pnpm = "12.3.4"
"github:oasdiff/oasdiff" = "1.34.1"

[tasks.install]
run = "pnpm install"

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "typecheck", "test", "check:breaking", "build"]

[tasks.lint]
run = "pnpm lint"
[tasks.typecheck]
run = "pnpm typecheck"
[tasks.test]
run = "pnpm test"
[tasks."check:breaking"]
run = "pnpm check:breaking"
[tasks.build]
run = "pnpm build"
