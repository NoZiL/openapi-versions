[tools]
node = "26"
pnpm = "12.18.0"
"github:oasdiff/oasdiff" = "v1.37.0"
actionlint = "1.7.12"
jq = "1.8.2"

[tasks."check:fast"]
description = "Lint, typecheck, test; what the Claude Code Stop hook runs"
depends = ["lint", "typecheck", "test"]

[tasks.install]
run = "pnpm install"

[tasks.check]
description = "Everything CI runs; CI runs this task, so this is the only list (ADR 0026)"
depends = ["lint", "lint:workflows", "typecheck", "test", "test:hooks", "check:breaking", "build"]

[tasks.lint]
run = "pnpm lint"
[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows"
run = "actionlint"
# pnpm typecheck / pnpm test each start with codegen, and mise runs check:fast's deps in
# parallel. Here each codegen runs once, as a shared dep, and typecheck / test call the
# scripts that only read (ADR 0020, #62). Codegen replaces files in place, so a reader
# outside this run never sees a missing file either (ADR 0021, #79).
# `pnpm typecheck:tsc` and `pnpm test:run` run no codegen: on their own they need the
# generated dirs to exist already. stop-check.test.sh asserts these depends and run lines
# (in `test:hooks`, so in CI too), and the depends of `check`.
[tasks."codegen:playground"]
run = "pnpm codegen:playground"
[tasks."codegen:test"]
run = "pnpm codegen:test"
# Same outputs as `pnpm codegen`, which runs the two in sequence; mise runs them in
# parallel, so neither codegen may read the other's output (ADR 0020).
[tasks.codegen]
description = "Regenerate playground/generated and test/fixtures/generated (in parallel; pnpm codegen runs them in sequence)"
depends = ["codegen:playground", "codegen:test"]
[tasks.typecheck]
depends = ["codegen"]
run = "pnpm typecheck:tsc"
[tasks.test]
depends = ["codegen:test"]
run = "pnpm test:run"
[tasks."check:breaking"]
run = "pnpm check:breaking"
[tasks.build]
run = "pnpm build"

[tasks."test:hooks"]
description = "Tests for the Claude Code hooks (.claude/hooks/*.test.sh); needs git, jq, shasum, node, mise"
run = 'rc=0; for t in .claude/hooks/*.test.sh; do echo "== $t"; sh "$t" || rc=1; done; exit $rc'

[tasks."hook:guard"]
description = "Claude Code PreToolUse: deny edits to generated dirs and patches/ (stdin: hook JSON)"
file = ".claude/hooks/guard-generated.sh"
[tasks."hook:biome"]
description = "Claude Code PostToolUse: safe biome fixes on the edited file (stdin: hook JSON)"
file = ".claude/hooks/biome-fix.sh"

[settings]
# Lock only what we run on (CI + dev machines); every extra platform is another GitHub download that can 504.
lockfile_platforms = ["linux-x64", "macos-arm64"]
# GitHub release downloads 504 now and then; retry harder than the default 3.
http_retries = 8
