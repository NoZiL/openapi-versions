[tools]
node = "26"
pnpm = "12.18.0"
"github:oasdiff/oasdiff" = "v1.35.0"
actionlint = "1.7.12"
jq = "1.8.2"

[tasks."check:fast"]
description = "Lint, typecheck, test; what the Claude Code Stop hook runs"
depends = ["lint", "typecheck", "test"]

[tasks.install]
run = "pnpm install"

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "lint:workflows", "typecheck", "test", "check:breaking", "build"]

[tasks.lint]
run = "pnpm lint"
[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows"
run = "actionlint"
# typecheck and test read both generated dirs, and `pnpm typecheck` / `pnpm test` each start
# with `rm -rf` + codegen. mise runs deps in parallel, so one could delete the dir while the
# other reads it (#62). Here codegen runs once as a shared dep and the tasks only read.
[tasks.codegen]
description = "Regenerate playground/generated and test/fixtures/generated"
run = "pnpm codegen"
[tasks.typecheck]
depends = ["codegen"]
run = "pnpm exec tsc --noEmit"
[tasks.test]
depends = ["codegen"]
run = "pnpm exec vitest run"
[tasks."check:breaking"]
run = "pnpm check:breaking"
[tasks.build]
run = "pnpm build"

[tasks."hook:guard"]
description = "Claude Code PreToolUse: deny edits to generated dirs and patches/ (stdin: hook JSON)"
file = ".claude/hooks/guard-generated.sh"
[tasks."hook:biome"]
description = "Claude Code PostToolUse: safe biome fixes on the edited file (stdin: hook JSON)"
file = ".claude/hooks/biome-fix.sh"

[settings]
# Lock only what we run on (CI + dev machines); every extra platform is another GitHub download that can 504.
lockfile_platforms = ["linux-x64", "macos-arm64"]
# GitHub release downloads 504 now and then; retry harder than the default 3.
http_retries = 8
