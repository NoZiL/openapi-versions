[tools]
node = "24"
pnpm = "12.18.0"
"github:oasdiff/oasdiff" = "1.34.1"
actionlint = "1.7.12"

[tasks.install]
run = "pnpm install"

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "lint:workflows", "typecheck", "test", "check:breaking", "build"]

[tasks.lint]
run = "pnpm lint"
[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows"
run = "actionlint"
[tasks.typecheck]
run = "pnpm typecheck"
[tasks.test]
run = "pnpm test"
[tasks."check:breaking"]
run = "pnpm check:breaking"
[tasks.build]
run = "pnpm build"
