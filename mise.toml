[tools]
node = "26"
pnpm = "12.18.0"
"github:oasdiff/oasdiff" = "1.34.1"
actionlint = "1.7.12"
# Dev-only: the .claude hooks need it. macOS-only so the linux CI runner (jq is preinstalled there) does not download it.
jq = { version = "1.8.2", os = ["macos"] }

[tasks.install]
run = "pnpm install"

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "lint:workflows", "typecheck", "test", "check:breaking", "build"]

[tasks.lint]
run = "pnpm lint"
[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows"
run = "actionlint"
[tasks.typecheck]
run = "pnpm typecheck"
[tasks.test]
run = "pnpm test"
[tasks."check:breaking"]
run = "pnpm check:breaking"
[tasks.build]
run = "pnpm build"

[settings]
# Lock only what we run on (CI + dev machines); every extra platform is another GitHub download that can 504.
lockfile_platforms = ["linux-x64", "macos-arm64"]
# GitHub release downloads 504 now and then; retry harder than the default 3.
http_retries = 8
