name: Release
on:
  push:
    branches: [main]
  workflow_dispatch: # snapshot prerelease, see docs/adr/0008

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Writes go through the nozil-release-bot GitHub App token below, not the workflow's own token.
# changesets/action exports it as GITHUB_TOKEN to the version and publish scripts.
permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # changesets/action pushes via the API with its github-token input; keep the bot token out of .git/config during pnpm install
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # v2 commits, tags and releases via the API with this token; using the bot's token means CI runs on the release PR
          github-token: ${{ steps.app.outputs.token }}
          publish-script: pnpm release
          version-script: pnpm changeset version
        env:
          NPM_CONFIG_PROVENANCE: "true" # auth is npm trusted publishing (OIDC), no token

  snapshot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
      - run: pnpm install --frozen-lockfile
      - name: Require pending changesets
        # without them `changeset publish` would publish the current version under the next tag
        run: find .changeset -name '*.md' ! -name README.md | grep -q .
      - run: pnpm changeset version --snapshot next
      - run: pnpm build
      - run: pnpm changeset publish --tag next --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: "true"
