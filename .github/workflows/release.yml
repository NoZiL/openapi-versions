name: Release
on:
  push:
    branches: [main]
  workflow_dispatch: # snapshot prerelease, see docs/adr/0008

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Writes go through the nozil-release-bot GitHub App token below, not GITHUB_TOKEN.
permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app.outputs.token }} # pushes and tags are made by the bot, so CI runs on the release PR
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true" # auth is npm trusted publishing (OIDC), no token

  snapshot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Require pending changesets
        # without them `changeset publish` would publish the current version under the next tag
        run: ls .changeset/*.md | grep -v README.md
      - run: pnpm changeset version --snapshot next
      - run: pnpm build
      - run: pnpm changeset publish --tag next --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: "true"
