name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3 # node, pnpm and oasdiff from mise.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: actionlint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:breaking
      - run: pnpm build
