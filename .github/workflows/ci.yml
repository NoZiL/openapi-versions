name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5 # every tool in mise.toml
      - run: pnpm install --frozen-lockfile
      # [tasks.check] in mise.toml is the only list of checks: add new ones there, not here (ADR 0026).
      # Flags go before the task name, or mise passes them to the task. --continue-on-error: one failing
      # check does not hide another. --output keep-order: each task's output is grouped, not interleaved.
      - run: mise run --continue-on-error --output keep-order check
