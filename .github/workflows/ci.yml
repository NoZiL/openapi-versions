name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5 # node, pnpm, oasdiff and jq (hook tests) from mise.toml
      - run: pnpm install --frozen-lockfile
      # [tasks.check] in mise.toml is the only list of checks: add new ones there, not here (ADR 0026).
      # --continue-on-error (before the task name, or mise passes it to the task): one failing check does not hide another.
      - run: mise run --continue-on-error check
