name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5 # node, pnpm and oasdiff from mise.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: actionlint
      - run: pnpm typecheck
      - run: pnpm test
      - run: mise run test:hooks
      - run: pnpm check:breaking
      - run: pnpm build
